<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        rect { fill: #115753; }
        path { fill: white; }
      }
    </style>
  </defs>
  <rect width="256" height="256" fill="#115753"/>
  <!-- Chain link icon centered -->
  <g transform="translate(128, 128)">
    <!-- Left chain link -->
    <ellipse cx="-35" cy="0" rx="25" ry="35" fill="none" stroke="white" stroke-width="18"/>
    <!-- Right chain link -->
    <ellipse cx="35" cy="0" rx="25" ry="35" fill="none" stroke="white" stroke-width="18"/>
    <!-- Connection line between links -->
    <line x1="-10" y1="0" x2="10" y2="0" stroke="white" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
